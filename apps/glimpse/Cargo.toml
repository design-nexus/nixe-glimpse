[package]
name = "nixe-glimpse"
version = "0.1.0"
default-run = "nixe-glimpse"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
glimpse-plugin-sdk = { path = "../../crates/glimpse-plugin-sdk" }
nixe-core = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-core", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-ui = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-theme = { git = "file:///home/ken/Projects/nixe-migration-97c1899-reviewed/nixe-design", rev = "6997fb93fe248e20a19277dbd3ef219cdba18683" }
nixe-passwords-proto = { git = "file:///home/ken/Projects/nixe-migration-97c1899-apps-complete/nixe-passwords", rev = "0d13dd06ced230e2e477a01e9f52d9f33e81a16e", features = ["client"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
notify = "8"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
