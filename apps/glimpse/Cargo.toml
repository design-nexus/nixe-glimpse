[package]
name = "nixe-glimpse"
version = "0.1.0"
default-run = "nixe-glimpse"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
glimpse-plugin-sdk = { path = "../../crates/glimpse-plugin-sdk" }
nixe-core = { path = "../../crates/nixe-core" }
nixe-ui = { path = "../../crates/nixe-ui" }
nixe-theme = { path = "../../crates/nixe-theme" }
nixe-passwords-proto = { path = "../../crates/nixe-passwords-proto", features = ["client"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
notify = "8"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
