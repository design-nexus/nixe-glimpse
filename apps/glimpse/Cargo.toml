[package]
name = "nyx-glimpse"
version = "0.1.0"
default-run = "nyx-glimpse"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
glimpse-plugin-sdk = { path = "../../crates/glimpse-plugin-sdk" }
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "938c638951a53f5874a8276d07ac9dcd68b191ad" }
nyx-passwords-proto = { git = "https://github.com/design-nexus/nyx-passwords.git", rev = "f30ea2887724df67870a066228e737cf278f33a0", features = ["client"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
libc = "0.2"
notify = "8"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
